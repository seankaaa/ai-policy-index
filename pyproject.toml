[project]
name = "ai-policy-dataset"
version = "0.1.0"
description = "Unified AI policy, readiness, and public opinion dataset"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "polars>=0.20",
    "pydantic>=2.0",
    "pycountry>=23.12",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "tenacity>=8.2",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "openpyxl>=3.1",
    "lxml>=5.0",
    "pyarrow>=15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]
